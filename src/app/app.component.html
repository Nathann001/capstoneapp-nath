<div class="app-container">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Mobile Menu Toggle Button -->
  <button class="mobile-menu-toggle" *ngIf="showSidebar" (click)="toggleMobileSidebar()">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Sidebar Overlay (for mobile) -->
  <div class="sidebar-overlay"
       [class.active]="isMobileSidebarOpen"
       (click)="closeMobileSidebar()"
       *ngIf="showSidebar"></div>

  <!-- Sidebar -->
  <aside class="sidebar"
         [class.mobile-open]="isMobileSidebarOpen"
         *ngIf="showSidebar">
    <div class="sidebar-logo">
      <img src="assets/images/angeles_city_logo.png" alt="Logo" />
    </div>

    <!-- Regular User Links -->
    <ng-container *ngIf="!isAdmin && !isStaff">
      <a class="side-btn"
         routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="closeMobileSidebar()">
        <i class="fas fa-house"></i><span>Home</span>
      </a>
      <a class="side-btn"
         routerLink="/documents"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fas fa-file"></i><span>Documents</span>
      </a>
      <a class="side-btn"
         routerLink="/my-requests"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fa-solid fa-envelope-open-text"></i><span>Requests</span>
      </a>
    </ng-container>

    <!-- Staff Links -->
    <ng-container *ngIf="isStaff">
      <a class="side-btn"
         routerLink="/home-staff"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fas fa-house"></i><span>Staff Home</span>
      </a>
    </ng-container>

    <!-- Admin Links -->
    <ng-container *ngIf="isAdmin">
      <a class="side-btn"
         routerLink="/admin"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fa-solid fa-chart-line"></i><span>Admin</span>
      </a>
      <a class="side-btn"
         routerLink="/admin-users"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fa-solid fa-users"></i><span>Users</span>
      </a>
      <a class="side-btn"
         routerLink="/archives"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fa-solid fa-archive"></i><span>Archives</span>
      </a>
    </ng-container>

    <!-- Bottom Links -->
    <div class="sidebar-bottom">
      <a class="side-btn"
         routerLink="/account"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="fa-solid fa-user"></i><span>Account</span>
      </a>
      <a class="side-btn"
         (click)="logout()"
         style="cursor:pointer;">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content-area" [ngClass]="{'no-sidebar': !showSidebar}">
    <router-outlet></router-outlet>
  </main>

  <!-- 🔒 Profile Incomplete Modal -->
  <div class="modal-backdrop" *ngIf="showProfileIncompleteModal" (click)="closeProfileModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <div class="modal-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h2 class="modal-title">Complete Your Profile First</h2>
      <p class="modal-message">
        You need to fill in your personal information before you can access documents or make requests.
      </p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn--primary" (click)="goToAccount()">
          <i class="fa-solid fa-user-pen"></i> Go to Account
        </button>
        <button class="modal-btn modal-btn--secondary" (click)="closeProfileModal()">
          Maybe Later
        </button>
      </div>
    </div>
  </div>

</div>

<style>
  /* Modal Backdrop */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(3px);
    animation: fadeIn 0.2s ease;
  }

  /* Modal Box */
  .modal-box {
    background: #fff;
    border-radius: 16px;
    padding: 2rem 2.5rem;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease;
  }

  .modal-icon {
    font-size: 3rem;
    color: #f59e0b;
    margin-bottom: 1rem;
  }

  .modal-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: #1e293b;
    margin: 0 0 0.75rem;
  }

  .modal-message {
    font-size: 0.95rem;
    color: #64748b;
    margin: 0 0 1.5rem;
    line-height: 1.6;
  }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .modal-btn {
    padding: 0.7rem 1.5rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
  }

  .modal-btn:hover { opacity: 0.88; }

  .modal-btn--primary {
    background: #2563eb;
    color: #fff;
  }

  .modal-btn--secondary {
    background: #f1f5f9;
    color: #475569;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
</style>
