<div class="otp-page">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="form-card">

      <!-- Mobile header -->
      <div class="mobile-header">
        <img src="/assets/images/angeles_city_logo.png" alt="Seal" class="mobile-seal" />
        <p class="mobile-title">Angeles City</p>
      </div>

      <!-- OTP Header -->
      <div class="otp-header">
        <div class="otp-icon-wrap"><i class="fa-solid fa-envelope-open-text"></i></div>
        <h2 class="form-title">Check your email</h2>
        <p class="otp-text" *ngIf="otpSent">
        We sent a 6-digit code to<br>
        <strong class="email-highlight">{{ otpForm.value.contact }}</strong>
</p>
      </div>

      <!-- OTP FORM -->
      <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">

        <!-- Email/Phone input -->
        <div class="field-group">
          <label class="field-label">Email or Phone</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="text" formControlName="contact" placeholder="Email or Phone"
              [class.input-invalid]="otpForm.get('contact')?.invalid && otpForm.get('contact')?.touched" />
          </div>
        </div>

        <!-- OTP input -->
        <div class="field-group">
          <label class="field-label">Verification Code</label>
          <div class="input-wrap">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="text" formControlName="otp" maxlength="6"
              placeholder="Enter 6-digit OTP"
              [class.input-invalid]="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched" />
          </div>
        </div>

        <!-- VERIFY BUTTON -->
        <button type="submit" class="btn-submit" [disabled]="otpForm.invalid || loading">
          <span *ngIf="!loading"><i class="fa-solid fa-circle-check"></i> Verify Account</span>
          <span *ngIf="loading" class="btn-spinner-wrap">
            <span class="spinner"></span> Verifying…
          </span>
        </button>

      </form>

      <!-- RESEND OTP -->
      <div class="resend-wrap">
        <button type="button" class="btn-resend" (click)="resendOtp()" [disabled]="resendCooldown > 0">
          <i class="fa-solid fa-rotate-right"></i>
          {{ resendCooldown > 0 ? 'Resend in ' + resendCooldown + 's' : 'Resend OTP' }}
        </button>

        <p class="resend-ok" *ngIf="message">
          <i class="fa-solid fa-circle-check"></i> {{ message }}
        </p>
      </div>

    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="panel-overlay"></div>
    <div class="panel-content">
      <img src="/assets/images/angeles_city_logo.png" alt="Seal" class="seal" />
      <h1 class="panel-title">Angeles City</h1>
      <p class="panel-eyebrow">Republic of the Philippines</p>
      <div class="panel-rule"></div>
      <p class="panel-desc">Join thousands of Angeleños accessing government services online — fast, easy, and secure.</p>
    </div>
    <div class="panel-footer">© 2026 City Government of Angeles</div>
  </div>

</div>
