<div class="app-container">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- DOCUMENTS CONTENT -->
  <section class="documents-page">
    <h2 class="page-title">Available Documents</h2>

    <div class="documents-list">

      <!-- REGULAR DOCUMENT CARDS -->
      <div *ngFor="let doc of documents">

        <!-- ===== APPOINTMENT BOOKING CARD ===== -->
        <div *ngIf="doc.isAppointment" class="document-card appointment-card">
          <div class="appointment-icon">
            <i class="fa-solid fa-calendar-check"></i>
          </div>
          <h3>{{ doc.name }}</h3>
          <p>Book a schedule for on-time or delayed registration of Birth, Death, or Marriage certificates. Available slots: 8:00 AM – 5:00 PM, up to 20 appointments per slot.</p>
          <div class="document-actions">
            <button class="apply-btn appointment-btn" (click)="applyForDocument(doc.applyRoute)">
              <i class="fa-solid fa-calendar-plus" style="margin-right: 6px;"></i>
              Book Appointment
            </button>
          </div>
        </div>

        <!-- ===== REGULAR DOCUMENT CARD ===== -->
        <div *ngIf="!doc.isAppointment" class="document-card">
          <h3>{{ doc.name }}</h3>
          <div class="document-actions">
            <button class="view-btn" (click)="viewDocument(doc.file)">
              View Requirements
            </button>
            <button class="apply-btn" (click)="applyForDocument(doc.applyRoute)">
              Apply
            </button>
          </div>
        </div>

      </div>
    </div>
  </section>
</div>
