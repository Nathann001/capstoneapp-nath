<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="login-bg">
    <div class="bg-image"></div>

    <h1 class="city-title">ANGELES CITY DOCUMENT REQUEST</h1>
    <img src="/assets/images/angeles_city_logo.png" alt="Angeles City Logo" class="logo" />
    <p class="welcome-text">CREATE YOUR ACCOUNT NOW</p>

    <div class="login-container">
        <div class="login-box">

            <!-- Registration Form -->
            <form *ngIf="!isOtpSent" [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form-box">

                <h3 class="login-title">SIGN UP</h3>

                <div class="input-with-icon">
                    <input type="email" formControlName="email" placeholder="Email Address" />
                </div>

                <div class="input-with-icon">
                    <input [type]="showPassword ? 'text' : 'password'"
                           formControlName="password"
                           placeholder="Password" />
                    <span class="password-toggle" (click)="showPassword = !showPassword">
                        <i [class]="showPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'"></i>
                    </span>
                </div>

                <div class="input-with-icon">
                    <input [type]="showConfirmPassword ? 'text' : 'password'"
                           formControlName="confirmPassword"
                           placeholder="Confirm Password" />
                    <span class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword">
                        <i [class]="showConfirmPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'"></i>
                    </span>
                </div>

                <button type="submit" class="login-btn" [disabled]="registerForm.invalid || loading">
                    {{ loading ? 'SENDING OTP...' : 'REGISTER' }}
                </button>

                <p class="register-text">
                    Already have an account?
                    <a routerLink="/login">Log in</a>
                </p>

            </form>

            <!-- OTP Verification Section -->
            <div *ngIf="isOtpSent" class="form-box">

                <h3 class="login-title">VERIFY YOUR ACCOUNT</h3>

                <p class="otp-text">
                    An OTP has been sent to <strong>{{ registerForm.value.email }}</strong>
                </p>

                <div class="input-with-icon">
                    <input type="text"
                           [(ngModel)]="otpCode"
                           [ngModelOptions]="{standalone: true}"
                           placeholder="Enter 6-digit OTP"
                           maxlength="6" />
                </div>

                <button type="button" (click)="onVerifyOtp()" class="login-btn"
                        [disabled]="otpCode.length < 6 || verifying">
                    {{ verifying ? 'VERIFYING...' : 'VERIFY ACCOUNT' }}
                </button>

                <div class="resend-container">
                    <button type="button"
                            class="resend-btn"
                            (click)="resendOtp()"
                            [disabled]="resendCooldown > 0">
                        <i class="fa-solid fa-rotate-right"></i>
                        {{ resendCooldown > 0 ? 'Resend OTP in ' + resendCooldown + 's' : 'Resend OTP' }}
                    </button>

                    <p class="resend-message" *ngIf="resendMessage">
                        <i class="fa-solid fa-circle-check"></i> {{ resendMessage }}
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ===== OTP ERROR MODAL ===== -->
<div class="modal-overlay" *ngIf="showErrorModal" (click)="closeErrorModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">

        <div class="modal-icon">
            <i class="fa-solid fa-circle-xmark"></i>
        </div>

        <h3 class="modal-title">Invalid OTP</h3>
        <p class="modal-message">{{ errorMessage }}</p>

        <button class="modal-close-btn" (click)="closeErrorModal()">Try Again</button>
    </div>
</div>
